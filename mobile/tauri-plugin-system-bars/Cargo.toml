[package]
name = "tauri-plugin-system-bars"
version = "0.1.0"
authors = ["Nosdesk"]
description = "Keeps the Android system bar icons legible against the app's own theme"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-system-bars"

[dependencies]
tauri = "2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
